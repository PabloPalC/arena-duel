<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Arte de cartas</title>
<style>body{margin:0;background:#222;color:#fff;font:14px system-ui} canvas{display:block}</style>
</head>
<body>
<div id="out"></div>
<script type="module">
import {
  Scene, PerspectiveCamera, WebGLRenderer, Group, Mesh, HemisphereLight, DirectionalLight, Box3, Vector3, SRGBColorSpace,
} from '../lib/three.js';
import { CARDS, RARITY, UNITS } from '../js/data.js';
import { buildUnit, compileRig, unitMaterials, buildSpellArt, TEAMS, VIS, PI } from '../js/models.js';

const AW = 256, AH = 320, SS = 2; // tamaño final y superamuestreo
const gl = new WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
gl.outputColorSpace = SRGBColorSpace;
gl.setPixelRatio(1);
gl.setSize(AW * SS, AH * SS);
gl.setClearColor(0x000000, 0);

function meshFromRig(rig) {
  const tpl = compileRig(rig);
  const mats = unitMaterials();
  for (const p of tpl.parts) {
    if (p.lit) p.pivot.add(new Mesh(p.lit, mats.lit));
    if (p.glow) p.pivot.add(new Mesh(p.glow, mats.glow));
  }
  return tpl.skel;
}

// poses para que el arte tenga más vida
const POSES = {
  knight: (s) => { s.getObjectByName('armR').rotation.set(-1.9, 0, 0.3); s.getObjectByName('armL').rotation.set(-0.7, 0, -0.2); },
  archer: (s) => { s.getObjectByName('armL').rotation.set(-1.45, 0.2, 0); s.getObjectByName('armR').rotation.set(-1.3, 0, 0.35); },
  goblin: (s) => { s.getObjectByName('armR').rotation.set(-2.2, 0, 0.2); s.getObjectByName('legL').rotation.x = 0.4; s.getObjectByName('legR').rotation.x = -0.4; },
  skeleton: (s) => { s.getObjectByName('armR').rotation.set(-1.8, 0, 0.2); },
  grenadier: (s) => { s.getObjectByName('armR').rotation.set(-2.6, 0, 0.2); },
  barbarian: (s) => { s.getObjectByName('armR').rotation.set(-2.4, 0, 0.2); },
  giant: (s) => { s.getObjectByName('armR').rotation.set(-1.3, 0, 0.3); s.getObjectByName('armL').rotation.set(-0.4, 0, -0.3); },
  pyromancer: (s) => { s.getObjectByName('armR').rotation.set(-1.5, 0, 0.2); },
  arquebusier: (s) => { s.getObjectByName('armR').rotation.set(-1.45, 0, 0.1); s.getObjectByName('armL').rotation.set(-1.3, 0, 0.5); },
  berserker: (s) => { s.getObjectByName('armR').rotation.set(-2.6, 0, 0.3); },
  necromancer: (s) => { s.getObjectByName('armR').rotation.set(-0.5, 0, 0.2); s.getObjectByName('armL').rotation.set(-1.4, 0, -0.3); },
  frost: (s) => { s.getObjectByName('armR').rotation.set(-0.4, 0, 0.2); s.getObjectByName('armL').rotation.set(-1.4, 0, -0.4); },
  automaton: (s) => { s.getObjectByName('armR').rotation.set(-1.7, 0, 0.2); },
  golem: (s) => { s.getObjectByName('armR').rotation.set(-1.4, 0, 0.1); s.getObjectByName('armL').rotation.set(-0.3, 0, -0.2); },
  draco: (s) => { s.getObjectByName('wingL').rotation.z = 0.5; s.getObjectByName('wingR').rotation.z = -0.5; },
  bat: (s) => { s.getObjectByName('wingL').rotation.z = 0.6; s.getObjectByName('wingR').rotation.z = -0.6; },
  lancer: (s) => { const l = s.getObjectByName('legFL'); l.rotation.x = -0.6; s.getObjectByName('legFR').rotation.x = -0.2; s.getObjectByName('legBL').rotation.x = 0.3; },
  wolfrider: (s) => { s.getObjectByName('legFL').rotation.x = -0.6; s.getObjectByName('legBR').rotation.x = 0.5; s.getObjectByName('rarmR').rotation.set(-2.4, 0, 0.2); },
};

// composición de grupos (posiciones relativas, escala)
const GROUPS = {
  2: [[-0.32, 0, -0.25, 0.95], [0.3, 0, 0.1, 1]],
  3: [[-0.42, 0, -0.35, 0.92], [0.42, 0, -0.3, 0.92], [0, 0, 0.15, 1]],
  4: [[-0.45, 0, -0.45, 0.88], [0.45, 0, -0.4, 0.88], [-0.25, 0, 0.12, 1], [0.3, 0, 0.18, 1]],
  5: [[-0.5, 0.25, -0.5, 0.85], [0.5, 0.3, -0.45, 0.85], [-0.3, -0.05, 0.05, 0.95], [0.3, 0.05, 0.1, 0.95], [0, 0.35, -0.2, 0.9]],
};

function frame(cam, obj, fill = 0.82) {
  const box = new Box3().setFromObject(obj);
  const c = box.getCenter(new Vector3()), sz = box.getSize(new Vector3());
  const dir = new Vector3(0.55, 0.42, 1).normalize();
  const r = Math.max(sz.y * 0.62, sz.x * 0.5 / (AW / AH), sz.z * 0.4);
  const dist = r / Math.tan((cam.fov * PI / 180) / 2) / fill;
  cam.position.copy(c).addScaledVector(dir, dist);
  c.y -= sz.y * 0.02;
  cam.lookAt(c);
}

function bg(g, rarity) {
  const R = RARITY[rarity];
  const grd = g.createRadialGradient(AW * 0.5, AH * 0.38, 10, AW * 0.5, AH * 0.5, AH * 0.75);
  grd.addColorStop(0, R.color);
  grd.addColorStop(0.55, R.dark);
  grd.addColorStop(1, '#0d1024');
  g.fillStyle = grd;
  g.fillRect(0, 0, AW, AH);
  // rayos de luz
  g.save();
  g.translate(AW / 2, AH * 0.36);
  g.globalAlpha = 0.09;
  g.fillStyle = '#fff';
  for (let i = 0; i < 12; i++) {
    g.rotate(PI / 6);
    g.beginPath(); g.moveTo(0, 0); g.lineTo(-14, -AH); g.lineTo(14, -AH); g.closePath(); g.fill();
  }
  g.restore();
  // suelo
  const gr = g.createRadialGradient(AW / 2, AH * 0.86, 4, AW / 2, AH * 0.86, AW * 0.55);
  gr.addColorStop(0, 'rgba(0,0,0,0.45)');
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr;
  g.beginPath(); g.ellipse(AW / 2, AH * 0.86, AW * 0.55, AH * 0.12, 0, 0, PI * 2); g.fill();
  // viñeta
  const v = g.createRadialGradient(AW / 2, AH / 2, AH * 0.35, AW / 2, AH / 2, AH * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.45)');
  g.fillStyle = v; g.fillRect(0, 0, AW, AH);
}

window.renderCard = (id) => {
  const card = CARDS.find(c => c.id === id);
  const scene = new Scene();
  scene.add(new HemisphereLight(0xfff4e6, 0x3a3550, 2.2));
  const key = new DirectionalLight(0xffffff, 2.4); key.position.set(3, 5, 4); scene.add(key);
  const back = new DirectionalLight(0x9fd0ff, 1.6); back.position.set(-4, 3, -5); scene.add(back);
  const cam = new PerspectiveCamera(30, AW / AH, 0.05, 100);
  const group = new Group();
  if (card.type === 'spell') {
    const art = buildSpellArt(card.spell.kind, TEAMS.me);
    const tpl = meshFromRig({ root: art, top: 1.2 });
    tpl.rotation.y = card.spell.kind === 'arrows' ? 0.5 : -0.35;
    if (card.spell.kind === 'fireball') tpl.rotation.set(0.5, -0.9, 0.3);
    group.add(tpl);
  } else {
    const n = Math.min(card.count || 1, 5);
    const slots = n === 1 ? [[0, 0, 0, 1]] : GROUPS[n];
    for (const [x, y, z, s] of slots) {
      const rig = buildUnit(card.unit, TEAMS.me);
      const sk = meshFromRig(rig);
      if (POSES[card.unit]) POSES[card.unit](sk);
      if (rig.lift) sk.position.y = 0;
      sk.position.set(x * (card.unit === 'bat' ? 0.9 : 1), y, z);
      sk.scale.setScalar(s);
      sk.rotation.y = card.type === 'building' ? -0.5 : -0.25 + x * 0.3;
      group.add(sk);
    }
  }
  scene.add(group);
  group.updateMatrixWorld(true);
  frame(cam, group, card.type === 'building' ? 0.8 : card.type === 'spell' ? 0.72 : 0.86);
  gl.render(scene, cam);
  const out = document.createElement('canvas');
  out.width = AW; out.height = AH;
  const g = out.getContext('2d');
  bg(g, card.rarity);
  g.imageSmoothingQuality = 'high';
  g.drawImage(gl.domElement, 0, 0, AW, AH);
  document.getElementById('out').appendChild(out);
  return out.toDataURL('image/webp', 0.86);
};
window.cardIds = CARDS.map(c => c.id);
window.ready = true;
</script>
</body>
</html>
